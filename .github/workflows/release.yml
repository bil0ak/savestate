name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
          - name: linux-x86_64-musl
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - name: linux-aarch64-musl
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - name: windows-x86_64-experimental
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install musl compiler
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir package
          cp "target/${{ matrix.target }}/release/savestate" package/
          cp README.md package/
          cp LICENSE package/
          tar -C package -czf "savestate-${{ github.ref_name }}-${{ matrix.name }}.tar.gz" savestate README.md LICENSE
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory package
          Copy-Item "target/${{ matrix.target }}/release/savestate.exe" package/
          Copy-Item README.md package/
          Copy-Item LICENSE package/
          Compress-Archive -Path package/* -DestinationPath "savestate-${{ github.ref_name }}-${{ matrix.name }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: savestate-${{ github.ref_name }}-${{ matrix.name }}.*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Add uninstall scripts
        run: cp scripts/uninstall.sh scripts/uninstall.ps1 dist/
      - uses: sigstore/cosign-installer@v3
      - name: Create checksums and keyless signatures
        shell: bash
        run: |
          cd dist
          sha256sum savestate-* uninstall.sh uninstall.ps1 > SHA256SUMS
          for artifact in savestate-* uninstall.sh uninstall.ps1 SHA256SUMS; do
            cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "$artifact"
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
